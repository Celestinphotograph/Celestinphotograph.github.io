<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Celestin Photograph</title>
    <meta name="description" content="Celestin Photograph · 摄影作品集" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="stylesheet" href="css/base.css?v=6" />
    <link rel="stylesheet" href="css/home.css?v=6" />
    <link rel="stylesheet" href="css/category.css?v=6" />
    <link rel="stylesheet" href="css/viewer.css?v=6" />
</head>
<body>

    <!-- ================= 顶部：两个栏 ================= -->
    <header class="site-header" id="siteHeader">
        <!-- 第一栏：左上箭头 / 居中 Logo / 右上“更多” -->
        <div class="header-bar" id="bar1">
            <div class="header-bar-inner">
                <button class="bar-toggle" id="barToggle" aria-label="展开或收回分类栏"></button>

                <a class="logo" href="#/" aria-label="返回首页">
                    <span class="logo-main">Celestin</span>
                    <span class="logo-sub">Photograph</span>
                </a>

                <div class="bar-right">
                    <button class="more-btn" id="moreBtn" aria-label="更多信息"></button>
                    <div class="more-panel" id="morePanel">
                        <div class="panel-head">更多信息</div>
                        <div class="panel-item">关于本站 <span class="soon">待补充</span></div>
                        <div class="panel-item">联系我 <span class="soon">待补充</span></div>
                        <div class="panel-item">版权说明 <span class="soon">待补充</span></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 第二栏：分类导航（可由左上角箭头展开 / 收回） -->
        <div class="category-bar" id="bar2">
            <div class="category-bar-inner">
                <nav class="main-nav" id="mainNav"></nav>
            </div>
        </div>
    </header>

    <!-- ================= 首页 ================= -->
    <main class="view" id="view-home" aria-label="首页"></main>

    <!-- ================= 分类页 / 影集页 ================= -->
    <main class="view" id="view-category" aria-label="分类"></main>

    <!-- ================= 图集详情查看器 ================= -->
    <div class="viewer" id="viewer" aria-hidden="true" role="dialog" aria-modal="true">
        <div class="viewer-backdrop" id="viewerBackdrop"></div>
        <div class="viewer-panel" id="viewerPanel">
            <div class="viewer-stage" id="viewerStage"></div>
            <div class="viewer-title" id="viewerTitle"></div>
            <div class="viewer-count" id="viewerCount"></div>
            <div class="viewer-note" id="viewerNote"></div>
        </div>
        <button class="viewer-close" id="viewerClose" aria-label="关闭查看器"></button>
        <button class="viewer-nav prev" id="viewerPrev" aria-label="上一张"></button>
        <button class="viewer-nav next" id="viewerNext" aria-label="下一张"></button>
    </div>

    <!-- ================= 页脚（版权） ================= -->
    <footer class="site-footer">
        <div class="footer-inner">
            <span class="footer-name" id="footerName"></span>
            <span class="footer-copy" id="footerCopy"></span>
        </div>
    </footer>

    <!-- 数据配置（★ 用户编辑的文件） -->
    <script src="data/site-data.js?v=6"></script>
    <!-- 逻辑模块 -->
    <script src="js/core.js?v=6"></script>
    <script src="js/home.js?v=6"></script>
    <script src="js/category.js?v=6"></script>
    <script src="js/viewer.js?v=6"></script>
    <script src="js/app.js?v=6"></script>
</body>
</html>
